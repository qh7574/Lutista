name: CI Build

# 每次 push 到 master/main、以及任何 PR 都跑。
# 产出的是 perf 变体（R8 + 资源压缩，行为等同 release），但用 debug 密钥签名，
# 所以【不依赖任何 secret】—— fork 提的 PR 也能跑、也能拿到可安装的包。
#
# 为什么不是 assembleDebug：debug 变体 isDebuggable=true 且不跑 R8，
# Compose / MIUIX 的启动与滚动手感明显劣化，用它提测会得到错误结论。
# 为什么不是 assembleRelease：那需要 KEYSTORE_* 四个 secret，fork PR 直接红，
# 而且等于把正式签名密钥的暴露面从「打 tag 时」扩大到「每次 push」。
on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

# 同一个 ref 只保留最新一次运行，旧的自动取消，省 runner 时间。
concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Assemble minified APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 兜底：gradlew 的历史 mode 可能不是 100755（老分支、fork、以及 Windows 上提交过的
      # commit 都可能是 100644），Linux runner 上直接 ./gradlew 会 Permission denied，
      # 这里显式补一次可执行位，成本为零。
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 镜像自带 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk）。
      # 不要改回 android-actions/setup-android：它的 v3 会执行 `sdkmanager tools`，
      # 而 `tools` 包已从官方仓库移除，会直接 Failed to find package 'tools' 退出 1。
      # 这里直接找到镜像里的 sdkmanager（版本目录名为 16.0 之类的数字，不是 latest）。
      #
      # 四个组件的版本必须与 app/build.gradle.kts 严格一致：
      #   compileSdk = 37 / buildToolsVersion = "37.0.0"
      #   ndkVersion = "29.0.14206865" / externalNativeBuild.cmake.version = "4.1.2"
      # 绝不能用 latest —— NDK 或 CMake 版本漂移会让 native 构建失败或产出无法加载的 .so。
      # 平台包名是 platforms;android-37.0（API 37 带小版本号，不存在 platforms;android-37）。
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "${SDK}" ]; then
            echo "::error::Android SDK not found at ${SDK}"
            exit 1
          fi
          SDKMANAGER=""
          for candidate in "${SDK}"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "${candidate}" ]; then SDKMANAGER="${candidate}"; fi
          done
          if [ -z "${SDKMANAGER}" ]; then
            echo "::error::sdkmanager not found under ${SDK}/cmdline-tools/*/bin"
            ls -la "${SDK}" "${SDK}/cmdline-tools" || true
            exit 1
          fi
          echo "Using sdkmanager: ${SDKMANAGER}"
          echo "${SDK}/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "${SDKMANAGER}")" >> "$GITHUB_PATH"
          yes | "${SDKMANAGER}" --sdk_root="${SDK}" --licenses > /dev/null 2>&1 || true
          "${SDKMANAGER}" --sdk_root="${SDK}" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;4.1.2"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # perf 变体用 debug 密钥签名，而 debug keystore 是 AGP 首次构建时随机生成的：
      # 如果每个 runner 各生成一份，两次 CI 的包签名不同，覆盖安装会被拒（只能卸载，
      # 卸载 = 用户滤镜数据全丢）。缓存这份 keystore，让所有 CI 产物签名恒定。
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # AGP 9 只为 testBuildType（默认 debug）生成单测任务，没有 testPerfUnitTest，
      # 所以这里保持 testDebugUnitTest —— 单测是纯 JVM 逻辑，跑哪个变体的类都一样。
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # 签名后产物是 app-perf.apk；若 debug 密钥配置因为任何原因没生效，
      # AGP 只会产出 app-perf-unsigned.apk，下面的 upload 会以「找不到文件」直接红，
      # 避免出现「流水线绿但包装不上」。
      - name: Assemble minified APK
        run: ./gradlew assemblePerf --stacktrace

      - name: Upload minified APK
        uses: actions/upload-artifact@v4
        with:
          name: lutista-perf-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/perf/app-perf.apk
          if-no-files-found: error
          retention-days: 14

      # R8 mapping 是还原这个包崩溃堆栈的唯一依据，跟着包一起传。
      - name: Upload R8 mapping file
        uses: actions/upload-artifact@v4
        with:
          name: lutista-perf-mapping-${{ steps.sha.outputs.short }}
          path: app/build/outputs/mapping/perf/mapping.txt
          if-no-files-found: ignore
          retention-days: 14

      # 失败时把测试报告一起传上来，便于直接在 Actions 页面看哪条用例挂了。
      # 注意：app/build/reports/ 本身就包含 reports/tests/，只列父目录可以避免
      # upload-artifact@v4 对重复文件的 overwrite 警告。
      - name: Upload test and build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lutista-ci-reports-${{ steps.sha.outputs.short }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
